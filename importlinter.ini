# Phase 2: architecture contracts from NORTHSTAR_WORKER_FINAL_PLAN §8.
# import-linter v2 syntax (`[importlinter:<id>]` + `name`, plural `root_packages`).
# v2 auto-discovers setup.cfg / .importlinter / pyproject only, so this
# plan-named file is passed explicitly (see `make lint`):
#   lint-imports --config importlinter.ini
# Run with the same path mapping as pytest (pyproject `pythonpath`):
#   PYTHONPATH=.:backend:common lint-imports --config importlinter.ini
[importlinter]
include_external_packages = True
root_packages =
  agent
  app
  browser
  database
  eval
  mcp_server
  northstar_common
  verifier

[importlinter:verifier-independence]
name = Verifier is independent of agent, backend and MCP
type = forbidden
source_modules =
  verifier
forbidden_modules =
  agent
  app
  backend
  mcp_server

[importlinter:backend-controllers-import-services-only]
name = Backend controllers import services only, never repositories
type = forbidden
source_modules =
  app.api
forbidden_modules =
  app.repositories
# Direct imports only: services reaching repositories is legal (contract 4).
allow_indirect_imports = True

[importlinter:backend-services-never-import-controllers]
name = Backend services never import controllers
type = forbidden
source_modules =
  app.services
forbidden_modules =
  app.api
allow_indirect_imports = True

[importlinter:agent-nodes-are-thin]
name = Agent nodes never touch repositories, adapters or LLM clients
type = forbidden
source_modules =
  agent.nodes
forbidden_modules =
  agent.repositories
  agent.adapters
  agent.llm
# Direct imports only: nodes reach services, which own repository access.
allow_indirect_imports = True

[importlinter:mcp-server-has-no-db-access]
name = MCP server has no database access
type = forbidden
source_modules =
  mcp_server
forbidden_modules =
  database

# Enabled once eval/oracle_rules.py was created (Phase 5).
[importlinter:oracle-independence]
name = Eval oracle never imports the agent
type = forbidden
source_modules =
  eval.oracle_rules
forbidden_modules =
  agent
