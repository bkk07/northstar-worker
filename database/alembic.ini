# Phase 4: Alembic configuration (Postgres is the source of truth).
# URL is overridden by DATABASE_URL in database/alembic/env.py.
[alembic]
script_location = database/alembic
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5433/northstar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
