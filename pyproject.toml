[project]
name = "northstar-worker"
version = "0.1.0-phase9"
description = "Reliable Autonomous Operations Worker (Phase 9: control plane)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
]

# uv-native dev group (`uv sync --group dev`). Single-package project for now;
# per-service packages arrive with their feature phases.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "import-linter>=1.13",
  "pre-commit>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Lets `import northstar_common...` (PYTHONPATH=common) and `import app...`
# (PYTHONPATH=backend) work both locally and in CI without install.
pythonpath = [".", "common", "backend", "agent", "verifier", "mcp_server", "browser", "database", "eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in defaults) is FastAPI's mandatory Depends() idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent", "verifier", "mcp_server", "browser", "eval", "database", "northstar_common"]

[tool.mypy]
python_version = "3.11"
strict = false
# Multi-root layout (repo root + common/ + backend/): resolve
# `northstar_common.*` and `app.*` to their real module names.
explicit_package_bases = true
mypy_path = "common,backend"

# Safety-critical packages are strict from the start.
[[tool.mypy.overrides]]
module = ["northstar_common.*", "verifier.*"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
