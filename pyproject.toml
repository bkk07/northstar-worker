[project]
name = "northstar-worker"
version = "0.1.0-phase1"
description = "Reliable Autonomous Operations Worker (Phase 1 skeleton)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Lets `import northstar_common...` (PYTHONPATH=common) and `import app...`
# (PYTHONPATH=backend) work both locally and in CI without install.
pythonpath = [".", "common", "backend", "agent", "verifier", "mcp_server", "browser", "database", "eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
