# Phase 2: local infrastructure. Single Postgres 16 container; no Kafka,
# Redis, or other services per plan non-goals (NORTHSTAR_WORKER_FINAL_PLAN §4).
# Roles, schemas, and migrations arrive in Phase 4.
# Phase 11: the MCP tool server (typed boundary the agent can never bypass).
services:
  postgres:
    image: postgres:16
    container_name: northstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
# Host port 5433: a native Windows PostgreSQL often occupies 5432.
# All repo URLs (session.py, alembic.ini, .env.example) use 5433.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: northstar-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      READ_API_URL: http://backend:8000
      FRONTEND_URL: http://frontend:5173
      MCP_PORT: 8002
      POLICY_TOKEN_SECRET: ${POLICY_TOKEN_SECRET:-local-policy-secret}
    ports:
      - "8002:8002"

volumes:
  pgdata:
