# Phase 2: local infrastructure. Single Postgres 16 container; no Kafka,
# Redis, or other services per plan non-goals (NORTHSTAR_WORKER_FINAL_PLAN §4).
# Roles, schemas, and migrations arrive in Phase 4.
services:
  postgres:
    image: postgres:16
    container_name: northstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
# Host port 5433: a native Windows PostgreSQL often occupies 5432.
# All repo URLs (session.py, alembic.ini, .env.example) use 5433.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
