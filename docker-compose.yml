# Phase 1 (10-phase prototype spec §6, §17): Dockerized PostgreSQL 16 +
# pgvector is the source of truth. No Kafka/Redis/Celery per non-goals.
# Customer UI :5174, Support UI :5175, API :8000, MCP :8002.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: northstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
# Host port 5433: a native Windows PostgreSQL often occupies 5432.
# All repo URLs (session.py, alembic.ini, .env.example) use 5433.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: northstar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/northstar
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret}
      DELIVERY_DELAY_SECONDS: ${DELIVERY_DELAY_SECONDS:-60}
    ports:
      - "8000:8000"

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: northstar-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      READ_API_URL: http://backend:8000
      FRONTEND_URL: http://frontend:5173
      MCP_PORT: 8002
      POLICY_TOKEN_SECRET: ${POLICY_TOKEN_SECRET:-local-policy-secret}
    ports:
      - "8002:8002"

volumes:
  pgdata:
